# Publishes the package with PyPI "Trusted Publishing": no token is stored anywhere.
#
#   TestPyPI: Actions -> "Publish package" -> Run workflow (the `testpypi` environment asks for approval)
#   PyPI:     push a tag such as v0.1.0 that matches the version in pyproject.toml
#             (the `pypi` environment asks for approval)
#
# One-time setup, done by the maintainer with their own logins:
#   - GitHub: Settings -> Environments -> create `testpypi` and `pypi`, with yourself as required reviewer.
#   - PyPI and TestPyPI: Account -> Publishing -> add a "pending publisher" with
#       project colab-cli-mcp, owner amgallego8, repository Colab-MCP,
#       workflow publish-to-pypi.yml, environment pypi (PyPI) / testpypi (TestPyPI).

name: Publish package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install "mcp<2" nbformat google-auth google-auth-oauthlib requests
      - name: Run the four test suites
        run: |
          python tests/test_server.py
          python tests/test_drive.py
          python tests/test_footprint.py
          python tests/test_mount.py

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Build and check the distributions
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/colab-cli-mcp
    permissions:
      id-token: write  # mandatory for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/colab-cli-mcp
    permissions:
      id-token: write  # mandatory for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
